---
version: '3'

tasks:
  build:
    desc: Build the firmware
    cmds:
      - pio run -e esp32-s3-devkitc-1

  flash:
    desc: Flash the firmware to the ESP32-S3
    cmds:
      - pio run -e esp32-s3-devkitc-1 --target upload

  monitor:
    desc: Open serial monitor
    cmds:
      - pio device monitor

  fetch-model:
    desc: Download the pre-built TinyStories model and tokenizer from slvDev/esp32-ai-tinystories
    dir: pc_tools
    cmds:
      - uv run --no-project --with 'huggingface-hub' python -c "from huggingface_hub import hf_hub_download; hf_hub_download(repo_id='slvDev/esp32-ai-tinystories', filename='model.bin', local_dir='.'); hf_hub_download(repo_id='slvDev/esp32-ai-tinystories', filename='tokenizer.json', local_dir='.')"

  fetch-model-tinyllamas:
    desc: Download and export the TinyStories weights from TinyLlamas (legacy)
    dir: pc_tools
    cmds:
      - uv run python export_model.py

  flash-model:
    desc: Flash the pre-built model.bin to the model partition at 0x110000
    cmds:
      - esptool --baud 921600 --port /dev/ttyACM0 write-flash 0x110000 pc_tools/stories15M_q4.bin

  generate-vocab:
    desc: Generate src/generated/vocab.h from the tokenizer
    cmds:
      - uv run python pc_tools/generate_vocab.py

  quantize:
    desc: Quantize the downloaded TinyLlamas model to INT4
    dir: pc_tools
    cmds:
      - uv run --with numpy --with torch --with huggingface-hub python export_model.py stories15M_q4.bin

  prepare:
    desc: Download the TinyStories dataset and train the BPE tokenizer
    cmds:
      - uv run python -m research.tinystories.prepare --vocab 32768

  train-test:
    desc: Train a quick 1.5M parameter TinyLM PLE model (500 steps) for testing
    cmds:
      - uv run python -m research.tinystories.train --arm ple --vocab 32768 --target-core 1500000 --steps 500 --seed 0 --tag v32768_c1500000 --micro-batch-size 4 --profile-memory

  train-full:
    desc: Train a full 15M parameter TinyLM PLE model (5000 steps)
    cmds:
      - uv run python -m research.tinystories.train --arm ple --vocab 32768 --target-core 15000000 --steps 5000 --seed 0 --tag v32768_c15000000 --micro-batch-size 4 --profile-memory

  export-test:
    desc: Export the quick 1.5M test model to binary format
    cmds:
      - uv run python -m research.tinystories.export --tokenizer data/tinystories/vocab-32768/tokenizer.json ple-v32768_c1500000-s0

  colab-check:
    desc: Check Google Colab CLI authentication status
    cmds:
      - uv run python colab_runner.py check-auth

  colab-quantize:
    desc: Quantize TinyStories 15M model on Google Colab Free Tier and download binary
    cmds:
      - uv run python colab_runner.py build --action quantize

  colab-train-test:
    desc: Train 1.5M TinyLM test model on Google Colab Free Tier T4 GPU and download binary
    cmds:
      - uv run python colab_runner.py build --action train-test

  colab-train-full:
    desc: Train full 15M TinyLM model on Google Colab Free Tier T4 GPU and download binary
    cmds:
      - uv run python colab_runner.py build --action train-full

  colab-stop:
    desc: Stop active Google Colab session to release free tier resources
    cmds:
      - uv run python colab_runner.py stop-session

  colab-patch:
    desc: Apply KernelClient compatibility patch to google-colab-cli
    cmds:
      - uv run python patch_colab_cli.py


