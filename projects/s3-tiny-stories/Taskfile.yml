version: '3'

tasks:
  build:
    desc: Build the ESP32-S3 TinyLM firmware
    cmds:
      - pio run -e esp32-s3-devkitc-1

  test:
    desc: Run host-native C/C++ unit tests
    cmds:
      - pio test -e native

  flash:
    desc: Flash the compiled firmware to the ESP32-S3
    cmds:
      - pio run -e esp32-s3-devkitc-1 -t upload

  monitor:
    desc: Monitor serial output from the device
    cmds:
      - pio device monitor

  fetch-model:
    desc: Download and verify the pre-built TinyStories PLE model and tokenizer from slvDev/esp32-ai-tinystories
    cmds:
      - ./scripts/fetch_model.sh

  flash-model:
    desc: Flash the pre-built model.bin to the model partition at 0x110000
    cmds:
      - esptool --baud 921600 --port /dev/ttyACM0 write-flash 0x110000 pc_tools/model.bin

  generate-vocab:
    desc: Generate src/generated/vocab.h from the tokenizer
    cmds:
      - uv run python pc_tools/generate_vocab.py

  benchmark:
    desc: Run on-device serial benchmark
    vars:
      PORT: '{{.PORT | default "/dev/ttyACM0"}}'
      OUT: '{{.OUT | default "runs/latest.json"}}'
      BASELINE: '{{.BASELINE | default "runs/baseline.json"}}'
    cmds:
      - uv run --with pyserial python scripts/benchmark_device.py tinystories --port {{.PORT}} --out {{.OUT}} --baseline {{.BASELINE}}

  export-model:
    desc: Export a trained PLE checkpoint to INT4 packed binary format
    cmds:
      - uv run python pc_tools/export_model.py

  prepare:
    desc: Download the TinyStories dataset and train the BPE tokenizer
    cmds:
      - uv run python -m research.tinystories.prepare --vocab 25353

  train-test:
    desc: Train a quick 1.5M parameter TinyLM PLE model (500 steps) for testing
    cmds:
      - uv run python -m research.tinystories.train --arm ple --vocab 25353 --target-core 1500000 --steps 500 --seed 0 --tag v25353_c1500000 --micro-batch-size 4 --profile-memory

  train-full:
    desc: Train a full PLE model (28.9M params, 14.9MB INT4) matching esp32-ai
    cmds:
      - uv run python -m research.tinystories.train --arm ple --vocab 32768 --d-model 96 --n-layers 6 --ple-dim 128 --target-core 560000 --batch-size 16 --seq-len 256 --steps 5000 --seed 0 --tag v32768_c560000

  export-test:
    desc: Export the quick 1.5M test model to binary format
    cmds:
      - uv run python -m research.tinystories.export --tokenizer pc_tools/tokenizer.json ple-v25353_c1500000-s0

  colab-check:
    desc: Check Google Colab CLI authentication status
    cmds:
      - uv run python colab_runner.py check-auth

  colab-quantize:
    desc: Quantize TinyStories model on Google Colab Free Tier and download binary
    cmds:
      - uv run python colab_runner.py build --action quantize

  colab-train-test:
    desc: Train a test PLE model on Google Colab Free Tier (T4 GPU)
    cmds:
      - uv run python colab_runner.py build --action train-test

  colab-train-full:
    desc: Train a full PLE model on Google Colab Free Tier (T4 GPU)
    cmds:
      - uv run python colab_runner.py build --action train-full

  colab-stop:
    desc: Stop and terminate active Google Colab session to prevent idle usage
    cmds:
      - uv run python colab_runner.py stop

  colab-patch:
    desc: Apply compatibility patch to google-colab-cli for KernelClient import error
    cmds:
      - uv run python patch_colab_cli.py

  verify-size:
    desc: Verify model binary size and memory budget for ESP32-S3-DevKitC-1-N16R8
    cmds:
      - uv run python ../../.agents/skills/verify-model-size/scripts/verify_model_size.py {{.CLI_ARGS}}

  upload-model:
    desc: Upload model binary and tokenizer to Hugging Face Hub
    cmds:
      - uv run python upload_model_hf.py

  upload-bin:
    desc: Upload model.bin and tokenizer to Hugging Face Hub
    vars:
      MODEL_PATH: '{{.MODEL_PATH | default "pc_tools/model.bin"}}'
    cmds:
      - uv run python upload_model_hf.py --path {{.MODEL_PATH}} {{.CLI_ARGS}}

  upload-custom:
    desc: Upload custom trained model to Hugging Face Hub
    cmds:
      - uv run python upload_model_hf.py --bin artifacts/tinystories/model.bin --repo-id ${HF_REPO:-nicholaswilde/esp32-tinystories}

  download-model:
    desc: Download model from Hugging Face Hub
    cmds:
      - uv run python download_model_hf.py

