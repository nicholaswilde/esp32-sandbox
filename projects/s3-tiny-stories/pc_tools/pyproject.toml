[project]
name = "pc-tools"
version = "0.1.0"
description = "Model export tools for s3-tiny-stories"
requires-python = ">=3.11"
dependencies = [
  "huggingface-hub",
  "torch",
  "numpy",
]

[project.optional-dependencies]
vocab = [
  "tokenizers==0.23.1",
]

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
